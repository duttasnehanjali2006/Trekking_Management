{% extends "base.html" %}
{% block title %}Update Trek{% endblock %}

{% block content %}
<h2 class="mb-4">Update: {{ trek.name }}</h2>

<form method="POST" class="col-md-6">
    <div class="mb-3">
        <label class="form-label">Total Slots</label>
        <input type="number" min="1" class="form-control" name="total_slots" value="{{ trek.total_slots }}" required>
        <div class="form-text">Currently available: {{ trek.available_slots }}</div>
    </div>
    <div class="mb-3">
        <label class="form-label">Status</label>
        <select class="form-select" name="status" required>
            {% for s in ['Pending', 'Approved', 'Open', 'Closed', 'Completed'] %}
            <option value="{{ s }}" {% if trek.status == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('staff.dashboard') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
